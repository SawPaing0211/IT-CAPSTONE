# /etc/nginx/sites-available/forge.conf on the Oracle Cloud VM.
# Reverse-proxies your domain/IP straight to the backend container
# (which only listens on 127.0.0.1:5000, never directly on the internet).
#
# Setup on the VM (Ubuntu):
#   sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo cp forge.conf /etc/nginx/sites-available/forge.conf
#   sudo ln -s /etc/nginx/sites-available/forge.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # then, once you have a domain name pointed at the VM's public IP:
#   sudo certbot --nginx -d api.yourdomain.com
#   # certbot rewrites this file to add the SSL block + auto-renewal itself
#
# If you don't have a domain yet, this still works over plain HTTP on the
# VM's public IP for initial testing — just skip the certbot step, and know
# the frontend (Vercel, which is HTTPS) may block "mixed content" calls to
# a plain-HTTP backend in some browsers. Get a domain (even a free one,
# e.g. from Cloudflare or DuckDNS) as soon as you can for the real defense.

server {
    listen 80;
    server_name api.yourdomain.com;  # replace with your domain, or the VM's public IP for now

    client_max_body_size 20M;  # room for file uploads (course materials, CSVs)

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sandbox code runs can take a few seconds; don't cut them off early.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
